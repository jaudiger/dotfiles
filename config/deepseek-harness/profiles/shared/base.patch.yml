- id: agent-default-model
  config:
    provider: openai-codex
    model: gpt-6-luna

- id: llm-pi-ai
  config:
    providers:
      openai-codex:
        reasoning: max

- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-fork
  config:
    provider: fork
    toolName: subagent_fork
    maxDepth: 1
